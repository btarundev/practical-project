<!doctype html><html><head><title>52 Perfect number</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>52. Perfect number</h1><p id="out"></p><script>const n=28;let sum=0;for(let i=1;i<n;i++)if(n%i===0)sum+=i;out.textContent=sum===n?'Perfect number':'Not perfect';</script></main></body></html>
