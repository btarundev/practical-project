<!doctype html><html><head><title>51 Armstrong</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>51. Armstrong number</h1><p id="out"></p><script>const n=153,d=String(n).split('');out.textContent=d.reduce((s,x)=>s+x**d.length,0)===n?'Armstrong number':'Not Armstrong';</script></main></body></html>
