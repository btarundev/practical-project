<!doctype html><html><head><title>29 Guessing game</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Number guessing game</h1><input id="guess" type="number" min="1" max="10"><button onclick="check()">Guess</button><p id="result"></p><script>const secret=Math.floor(Math.random()*10)+1;function check(){result.textContent=+guess.value===secret?'Correct!':`Try again. The number was not ${guess.value}.`}</script></main></body></html>
