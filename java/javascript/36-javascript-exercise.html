<!doctype html><html><head><title>36 Countdown</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Countdown timer</h1><h2 id="time">10</h2><button onclick="start()">Start</button><script>let n=10;function start(){const t=setInterval(()=>{time.textContent=--n;if(n<=0)clearInterval(t)},1000)}</script></main></body></html>
