<!doctype html><html><head><title>Forms and Validation</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Form Validation</h1><form id="form"><input id="name" required pattern="[A-Za-z ]+" placeholder="Name"><input id="email" required type="email" placeholder="Email"><input id="phone" required pattern="[0-9]{10}" placeholder="10-digit phone"><input id="password" required minlength="8" type="password" placeholder="Password"><input id="confirm" required minlength="8" type="password" placeholder="Confirm password"><button>Submit</button></form><p id="result"></p><script>form.onsubmit=e=>{e.preventDefault();result.textContent=password.value===confirm.value&&form.checkValidity()?'Form submitted successfully':'Please correct the fields';result.style.color=form.checkValidity()&&password.value===confirm.value?'green':'crimson'}</script></main></body></html>
