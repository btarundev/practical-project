<!doctype html><html><head><title>45 Local storage</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>45. localStorage</h1><input id="value" placeholder="Value"><button onclick="save()">Save</button><button onclick="read()">Retrieve</button><p id="out"></p><script>function save(){localStorage.setItem('sample',value.value)}function read(){out.textContent=localStorage.getItem('sample')||'No value saved'}</script></main></body></html>
