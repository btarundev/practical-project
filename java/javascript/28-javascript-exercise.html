<!doctype html><html><head><title>28 Calculator</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Simple calculator</h1><input id="a" type="number" value="10"><select id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select><input id="b" type="number" value="5"><button onclick="calculate()">Calculate</button><p id="result" class="output"></p><script>function calculate(){const x=+a.value,y=+b.value;result.textContent=({'+':x+y,'-':x-y,'*':x*y,'/':x/y})[op.value]}</script></main></body></html>
