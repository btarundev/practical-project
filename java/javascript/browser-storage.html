<!doctype html><html><head><title>Browser Objects and Storage</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Browser APIs and Storage</h1><button onclick="alert('Hello from Window')">Alert</button><button onclick="location.href='https://example.com'">Redirect</button><button onclick="history.back()">Back</button><button onclick="save()">Save localStorage</button><button onclick="read()">Read storage</button><p id="out"></p><script>out.textContent=`URL: ${location.href}\nBrowser: ${navigator.userAgent}\nScreen: ${screen.width}x${screen.height}\nLanguage: ${navigator.language}\nOnline: ${navigator.onLine}`;function save(){localStorage.setItem('username','Student');out.textContent='Saved username'}function read(){out.textContent=localStorage.getItem('username')||'Nothing saved'}</script></main></body></html>
