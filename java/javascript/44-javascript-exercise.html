<!doctype html><html><head><title>44 Dynamic API data</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>44. Display API data dynamically</h1><button onclick="load()">Load users</button><ul id="list"></ul><script>async function load(){const users=await fetch('https://jsonplaceholder.typicode.com/users').then(r=>r.json());list.innerHTML=users.map(u=>`<li>${u.name} - ${u.email}</li>`).join('')}</script></main></body></html>
