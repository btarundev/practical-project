<!doctype html><html><head><title>31 Validate fields</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Validate name, email, phone and password</h1><form id="form"><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="phone" placeholder="Phone"><input id="password" type="password" placeholder="8+ character password"><button>Check</button></form><p id="result"></p><script>form.onsubmit=e=>{e.preventDefault();result.textContent=/^[A-Za-z ]+$/.test(name.value)&&/^\S+@\S+\.\S+$/.test(email.value)&&/^\d{10}$/.test(phone.value)&&password.value.length>=8?'All fields valid':'Check name, email, 10-digit phone and password'}</script></main></body></html>
