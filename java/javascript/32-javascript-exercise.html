<!doctype html><html><head><title>32 To do list</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>To-do list</h1><input id="task" placeholder="New task"><button onclick="add()">Add</button><ul id="list"></ul><script>function add(){if(!task.value)return;const li=document.createElement('li');li.textContent=task.value+' ';const b=document.createElement('button');b.textContent='Remove';b.onclick=()=>li.remove();li.append(b);list.append(li);task.value=''}</script></main></body></html>
