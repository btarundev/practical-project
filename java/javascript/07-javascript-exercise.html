<!doctype html><html><head><title>07 Fibonacci</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>7. Fibonacci series</h1><div id="out" class="output"></div><script>let a=0,b=1,s=[];for(let i=0;i<10;i++){s.push(a);[a,b]=[b,a+b]}out.textContent=s.join(', ');</script></main></body></html>
