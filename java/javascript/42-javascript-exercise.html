<!doctype html><html><head><title>42 Async JavaScript</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>42. Callbacks, promises, async/await</h1><p id="out"></p><script>const callback=fn=>setTimeout(()=>fn('Callback complete'),300);const promise=new Promise(r=>setTimeout(()=>r('Promise complete'),600));async function run(){callback(x=>out.textContent=x);out.textContent+=' | '+await promise+' | Async complete'}run();</script></main></body></html>
