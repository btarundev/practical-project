<!doctype html><html><head><title>DOM Manipulation and Events</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>DOM Manipulation and Events</h1><button id="add">Add element</button><button id="remove">Remove last</button><button id="style">Change styles</button><input id="search" placeholder="Filter table"><textarea id="message" maxlength="100" placeholder="Type here"></textarea><p id="count">0/100</p><ul id="items"><li class="record">First record</li></ul><table><tbody id="table"><tr><th>Name</th><th>Action</th></tr></tbody></table><script>const items=document.querySelector('#items');add.onclick=()=>{const li=document.createElement('li');li.className='record';li.textContent='Dynamic item';items.appendChild(li)};remove.onclick=()=>items.lastElementChild?.remove();style.onclick=()=>document.querySelectorAll('.record').forEach(x=>x.style.color='crimson');message.oninput=()=>count.textContent=`${message.value.length}/100`;search.oninput=()=>document.querySelectorAll('.record').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(search.value.toLowerCase()));</script></main></body></html>
