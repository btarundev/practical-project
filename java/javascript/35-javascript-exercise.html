<!doctype html><html><head><title>35 Stopwatch</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>Stopwatch</h1><h2 id="time">0</h2><button onclick="start()">Start</button><button onclick="clearInterval(timer)">Stop</button><button onclick="time.textContent=0">Reset</button><script>let timer,seconds=0;function start(){clearInterval(timer);timer=setInterval(()=>time.textContent=++seconds,1000)}</script></main></body></html>
