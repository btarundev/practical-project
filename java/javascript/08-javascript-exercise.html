<!doctype html><html><head><title>08 Prime</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>8. Prime number</h1><div id="out" class="output"></div><script>const n=29;let prime=n>1;for(let i=2;i<=Math.sqrt(n);i++)if(n%i===0)prime=false;out.textContent=`${n} is ${prime?'prime':'not prime'}`;</script></main></body></html>
