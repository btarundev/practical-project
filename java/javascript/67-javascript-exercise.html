<!doctype html><html><head><title>67 Validate email</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>67. Validate email with RegExp</h1><input id="email" placeholder="you@example.com"><button onclick="result.textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)?'Valid email':'Invalid email'">Validate</button><p id="result"></p></main></body></html>
