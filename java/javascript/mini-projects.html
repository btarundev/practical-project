<!doctype html><html><head><title>JavaScript Mini Projects</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>JavaScript Mini Projects</h1><div class="grid"><div class="card"><h2>Calculator</h2><input id="a" type="number" value="5"><input id="b" type="number" value="3"><button onclick="calc.textContent=+a.value+ +b.value">Add</button><p id="calc"></p></div><div class="card"><h2>Clock</h2><h2 id="clock"></h2></div><div class="card"><h2>BMI calculator</h2><input id="weight" type="number" placeholder="kg"><input id="height" type="number" placeholder="metres"><button onclick="bmi.textContent=(weight.value/(height.value**2)).toFixed(2)">Calculate</button><p id="bmi"></p></div><div class="card"><h2>Random password</h2><button onclick="password.textContent=Math.random().toString(36).slice(2,12)">Generate</button><p id="password"></p></div></div><script>setInterval(()=>clock.textContent=new Date().toLocaleTimeString(),1000)</script></main></body></html>
