<!doctype html><html><head><title>09 Palindrome number</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>9. Number palindrome</h1><div id="out" class="output"></div><script>const n=1221,s=String(n);out.textContent=`${n} is ${s===s.split('').reverse().join('')?'a palindrome':'not a palindrome'}`;</script></main></body></html>
