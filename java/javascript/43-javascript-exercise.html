<!doctype html><html><head><title>43 Fetch API</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>43. Fetch data from an API</h1><button onclick="load()">Fetch post</button><pre id="out"></pre><script>async function load(){const r=await fetch('https://jsonplaceholder.typicode.com/posts/1');out.textContent=JSON.stringify(await r.json(),null,2)}</script></main></body></html>
