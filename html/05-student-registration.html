<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
</head>
<body>
  <h1>Student Registration Form</h1>
  <form action="#" method="post">
    <label for="name">Full name:</label><br><input id="name" name="name" type="text" required><br><br>
    <label for="email">Email:</label><br><input id="email" name="email" type="email" required><br><br>
    <label for="course">Course:</label><br>
    <select id="course" name="course"><option>Computer Applications</option><option>Science</option><option>Commerce</option></select><br><br>
    <label>Gender:</label><br><input id="male" name="gender" type="radio" value="male"><label for="male">Male</label>
    <input id="female" name="gender" type="radio" value="female"><label for="female">Female</label><br><br>
    <label for="address">Address:</label><br><textarea id="address" name="address" rows="4" cols="35"></textarea><br><br>
    <input id="agree" name="agree" type="checkbox" required><label for="agree">I agree to the terms.</label><br><br>
    <button type="submit">Register</button><button type="reset">Reset</button>
  </form>
</body>
</html>
