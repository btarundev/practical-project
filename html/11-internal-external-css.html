<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal and External CSS</title>
  <!-- External CSS example -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Internal CSS example -->
  <style>
    body { font-family: Arial, sans-serif; background: #f3f7ff; padding: 30px; }
    h1 { color: #173f9d; }
    .custom-box { padding: 20px; border: 2px solid #2563eb; background: white; }
  </style>
</head>
<body>
  <h1>Internal and External CSS</h1>
  <div class="custom-box">This box uses internal CSS. The Bootstrap button uses external CSS.</div>
  <button class="btn btn-primary mt-3">Bootstrap Button</button>
</body>
</html>
