<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Lists</title>
</head>
<body>
  <h1>HTML Lists</h1>
  <h2>Ordered List</h2>
  <ol><li>Wake up</li><li>Study HTML</li><li>Complete exercises</li></ol>
  <h2>Unordered List</h2>
  <ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>
  <h2>Description List</h2>
  <dl>
    <dt><strong>HTML</strong></dt><dd>The structure of a webpage.</dd>
    <dt><strong>CSS</strong></dt><dd>The style of a webpage.</dd>
  </dl>
</body>
</html>
