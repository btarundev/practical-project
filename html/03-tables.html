<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Tables</title>
  <style>table, th, td { border: 1px solid black; border-collapse: collapse; padding: 10px; } th { background: #dce8ff; }</style>
</head>
<body>
  <h1>Table with Merged Cells</h1>
  <table>
    <tr><th colspan="3">Student Details</th></tr>
    <tr><th>Name</th><th>Course</th><th>Marks</th></tr>
    <tr><td>Alex</td><td>HTML</td><td>90</td></tr>
    <tr><td rowspan="2">Jordan</td><td>CSS</td><td>85</td></tr>
    <tr><td>JavaScript</td><td>88</td></tr>
  </table>
</body>
</html>
