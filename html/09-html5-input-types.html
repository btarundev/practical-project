<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Input Types</title>
</head>
<body>
  <h1>HTML5 Input Types</h1>
  <form>
    <label for="email">Email:</label><input id="email" type="email" placeholder="student@example.com"><br><br>
    <label for="date">Date:</label><input id="date" type="date"><br><br>
    <label for="number">Number:</label><input id="number" type="number" min="1" max="100"><br><br>
    <label for="password">Password:</label><input id="password" type="password" minlength="8"><br><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
