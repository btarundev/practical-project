<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selectors and Styling</title>
  <style>
    body { background: #f5f7fb; color: #172033; font-family: Georgia, serif; margin: 0; }
    .container { margin: 30px auto; padding: 25px; max-width: 800px; border: 3px solid #2563eb; background: white; }
    h1 { color: #173f9d; font-family: Arial, sans-serif; }
    p { margin: 20px 0; padding: 15px; border: 2px solid #f0b429; }
    .highlight { background: #d7f8e8; border-color: #2dcf93; }
    #special { color: #c2410c; font-weight: bold; }
    .container strong { color: #2563eb; }
  </style>
</head>
<body>
  <main class="container">
    <h1>CSS Selectors and Styling</h1>
    <p>Element selector: this paragraph demonstrates margins, padding, colors, and borders.</p>
    <p class="highlight">Class selector: this paragraph has a highlighted background.</p>
    <p id="special">ID selector: this paragraph has a unique style.</p>
    <p><strong>Descendant selector:</strong> this strong element is styled inside the container.</p>
  </main>
</body>
</html>
