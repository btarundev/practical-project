<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Components</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h1 class="text-primary mb-4">Bootstrap Components</h1>
    <div class="alert alert-success">This is a Bootstrap alert.</div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#infoModal">Open Modal</button>
    <div class="progress my-4" role="progressbar" aria-label="Progress" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width: 75%">75%</div></div>
    <div class="card" style="max-width: 24rem;"><div class="card-body"><h2 class="card-title h5">Bootstrap Card</h2><p class="card-text">A reusable content component.</p><a href="#" class="btn btn-outline-primary">Learn more</a></div></div>
  </main>
  <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5" id="infoModalLabel">Bootstrap Modal</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body">This dialog is a Bootstrap component.</div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
